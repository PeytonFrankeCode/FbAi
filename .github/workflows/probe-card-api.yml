name: Probe The Card API

# A one-off question before paying: are The Card API's football sales good
# enough, and how many does the free key allow? Runs when the probe changes
# (GitHub's mobile site has no "Run workflow" button) or on demand.

on:
  push:
    paths:
      - scripts/probe-card-api.py
      - scripts/check-cardapi-photos.py
      - .github/workflows/probe-card-api.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Get the 26 Nov collection's saved sales
        uses: actions/download-artifact@v4
        with:
          pattern: cardapi-raw-*
          path: saved
          merge-multiple: true
          run-id: 45733866075
          github-token: ${{ github.token }}
      - name: Check their photos
        run: python scripts/check-cardapi-photos.py saved
      - name: Probe
        if: false
        run: python scripts/probe-card-api.py
        env:
          CARD_API_KEY: ${{ secrets.CARD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
