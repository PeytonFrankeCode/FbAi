name: Sync checklists

# Bring in checklists checklistinsider.com has published or added to since
# ours were taken (scripts/sync-checklistinsider.js), on GitHub's runner.
#
# WHY HERE. The agent sandbox cannot reach checklistinsider.com (the proxy
# answers 403), and the owner has no terminal. GitHub's runners can, so the
# sync runs here and pushes what it changed to a branch of its own. Nothing
# reaches main from this job: the branch is opened as a pull request, tested
# and reviewed like any other change.
#
# Started by hand (Run workflow), or by pushing a run/ branch, which is how
# the agent starts it: it can push a branch but not press the button.
# run/checklist-parallels also re-reads unchanged pages of products from
# 2024 on that hold a set with no parallels (--parallels). Never on a
# schedule, so it costs nothing unless asked.
on:
  workflow_dispatch:
    inputs:
      parallels:
        description: 'Also fill missing parallels on 2024+ products (slower)'
        type: boolean
        default: false
  push:
    branches: ['run/checklist-sync', 'run/checklist-parallels']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Sync from checklistinsider.com
        run: |
          set -o pipefail
          ARGS="--write"
          if [ "${{ github.ref_name }}" = "run/checklist-parallels" ] || [ "${{ inputs.parallels }}" = "true" ]; then ARGS="$ARGS --parallels=2024"; fi
          node scripts/sync-checklistinsider.js $ARGS | tee sync-report.txt
          { echo '## Checklist sync'; echo '```'; tail -150 sync-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Anything new?
        id: changed
        run: |
          # The checklist files only: the indexes below restamp their build
          # time on every run, which is not news.
          files=$(git status --porcelain -- public/data/checklists public/data/checklists-baseball public/data/checklists-basketball | awk '{print $2}' | grep '\.json$' | grep -v '/index\.json$' || true)
          if [ -z "$files" ]; then
            echo "Nothing new to bring in." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "$files" > changed.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the index, validate what changed, rebuild the card index
        if: steps.changed.outputs.any == 'true'
        run: |
          node scripts/rebuild-checklist-index.js
          # Football is what sales join to, so its errors stop the job. A
          # baseball or basketball file is tested as if it were football
          # ("2024 Donruss Baseball" against 2024 Donruss Football), so its
          # results are kept as notes for review, not as a stop.
          while read -r f; do
            case "$f" in
              public/data/checklists/*) node scripts/validate-checklist.js "$f" ;;
              *) node scripts/validate-checklist.js "$f" || echo "::notice::$f — validator notes above (not football; review only)" ;;
            esac
          done < changed.txt
          npm run build:card-index

      - name: Push the changes to a branch
        if: steps.changed.outputs.any == 'true'
        run: |
          BRANCH="checklist-sync/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data
          git commit -q -m "Checklists: sync from checklistinsider.com (run ${GITHUB_RUN_ID})" -m "$(tail -80 sync-report.txt)"
          git push -u origin "$BRANCH"
          echo "Pushed **$BRANCH**." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: sync-report.txt
          if-no-files-found: ignore
