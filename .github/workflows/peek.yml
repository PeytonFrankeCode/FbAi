name: Peek at a live endpoint
# Temporary (run/peek-newest): which Onit checklists does checklistinsider.com publish?
on:
  push:
    branches: ['run/peek-newest']
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Onit checklist page structure
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          curl -sS -L -m 30 -A "$UA" -o c.html https://onitathlete.com/pages/checklists
          echo "bytes $(wc -c < c.html)"
          echo "== links (non-asset)"
          grep -oE 'href="[^"]+"' c.html | grep -viE 'cdn/|fonts|\.css|facebook|twitter|instagram|tiktok|youtube|/collections/|/products/' | sort -u | head -80
          echo "== file links"
          grep -oiE '(https?:)?//[^"'"'"' ]+\.(pdf|xlsx|xls|csv)[^"'"'"' ]*' c.html | sort -u | head -40
          grep -oiE 'docs\.google\.com/[^"'"'"' ]+' c.html | sort -u | head -20
          echo "== headings"
          grep -oE '<h[1-4][^>]*>[^<]{2,120}</h[1-4]>' c.html | head -60
          echo "== checklist markup sample"
          grep -n -i 'checklist' c.html | cut -c1-300 | head -60
          echo "== json blobs"
          grep -oE '"(title|name|url|file|pdf)":"[^"]{2,150}"' c.html | sort -u | head -80
