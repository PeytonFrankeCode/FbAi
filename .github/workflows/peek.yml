name: Peek at a live endpoint
# Temporary (run/peek-newest): which Onit checklists does checklistinsider.com publish?
on:
  push:
    branches: ['run/peek-newest']
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Onit pages on checklistinsider.com
        shell: bash {0}
        run: |
          for sm in post-sitemap.xml post-sitemap2.xml post-sitemap3.xml page-sitemap.xml; do
            curl -sS -m 30 -A 'Mozilla/5.0 (TheCardHuddle checklist sync)' "https://www.checklistinsider.com/$sm" -o "$sm" || true
            echo "== $sm $(wc -c < $sm) bytes"
            grep -o '<loc>[^<]*</loc>' "$sm" | grep -i 'onit' | sed 's#<loc>##; s#</loc>##' || true
          done
          echo "== sample onit page"
          u=$(cat post-sitemap*.xml | grep -o '<loc>[^<]*onit[^<]*</loc>' | head -1 | sed 's#<loc>##; s#</loc>##')
          echo "$u"
          [ -n "$u" ] && curl -sS -m 30 -A 'Mozilla/5.0 (TheCardHuddle checklist sync)' "$u" | sed 's/<script[^>]*>.*<\/script>//g' | grep -o '<h[23][^>]*>[^<]*</h[23]>' | head -40
          echo "== search other sources"
          curl -sS -m 30 -A 'Mozilla/5.0' "https://www.checklistinsider.com/?s=onit" | grep -o 'href="https://www.checklistinsider.com/[^"]*onit[^"]*"' | sort -u | head -40
