name: Peek at a live endpoint
on:
  push:
    branches: ['run/peek-newest']
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: D1 rows read, by source and by query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NS=$(awk '/^\[\[kv_namespaces\]\]/{f=1} f && /^id *=/{gsub(/[" ]/,"",$0); sub(/^id=/,"",$0); print; exit}' wrangler.toml)
          for i in 0 1 2 3 4 5 6 7; do
            D=$(date -u -d "-$i day" +%F)
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/d1usage%3A$D" -o u.json
            echo "== $D  total=$(jq '[.[] | objects | .rowsRead] | add' u.json)"
            jq -r 'to_entries | map(select(.value|type=="object")) | sort_by(-.value.rowsRead) | .[:30][] | [.key, .value.queries, .value.rowsRead, .value.unmeasured] | @tsv' u.json
          done
          echo "== D1 analytics, by day"
          SINCE=$(date -u -d '-9 day' +%FT%TZ); NOW=$(date -u +%FT%TZ)
          Q='{"query":"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:20,filter:{datetime_geq:$s,datetime_leq:$e},orderBy:[date_ASC]){sum{rowsRead readQueries rowsWritten} dimensions{date databaseId}}}}}","variables":{"a":"'$CLOUDFLARE_ACCOUNT_ID'","s":"'$SINCE'","e":"'$NOW'"}}'
          curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$Q" | jq -c '.errors // (.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | [.dimensions.date, .dimensions.databaseId[0:8], .sum.rowsRead, .sum.readQueries, .sum.rowsWritten])'
          echo "== top queries by rows read, last 24h"
          SINCE=$(date -u -d '-1 day' +%FT%TZ)
          Q='{"query":"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:30,filter:{datetime_geq:$s,datetime_leq:$e},orderBy:[sum_rowsRead_DESC]){count sum{rowsRead queryDurationMs} dimensions{query}}}}}","variables":{"a":"'$CLOUDFLARE_ACCOUNT_ID'","s":"'$SINCE'","e":"'$NOW'"}}'
          curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$Q" > q.json
          jq -r '.errors // empty' q.json
          jq -r '.data.viewer.accounts[0].d1QueriesAdaptiveGroups[]? | "\(.sum.rowsRead)\t\(.count)\t\(.sum.queryDurationMs|floor)ms\t\(.dimensions.query[0:600] | gsub("\\s+";" "))"' q.json
          echo "== the 8-term title search, by hour"
          SINCE=$(date -u -d '-1 day' +%FT%TZ)
          Q='{"query":"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:60,filter:{datetime_geq:$s,datetime_leq:$e,query_like:\\"SELECT item_id, sold_date, title%\\"},orderBy:[datetimeHour_ASC]){count sum{rowsRead} dimensions{datetimeHour}}}}}","variables":{"a":"'$CLOUDFLARE_ACCOUNT_ID'","s":"'$SINCE'","e":"'$NOW'"}}'
          curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$Q" | jq -c '.errors // (.data.viewer.accounts[0].d1QueriesAdaptiveGroups[] | [.dimensions.datetimeHour[11:13], .count, .sum.rowsRead])'
