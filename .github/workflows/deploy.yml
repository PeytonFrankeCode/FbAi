name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Manual trigger, so a deploy can be re-run without inventing a commit.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build:pages derives each sitemap <lastmod>
          # from the last commit that touched the underlying
          # checklist file. A shallow clone would date every page to
          # the deploy instead, which is the thing we are fixing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the index test builds its fixture with node:sqlite,
          # which does not exist before 22.5. Node 20 is also past deprecation
          # on GitHub runners.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs the index endpoints against a real in-memory SQLite dataset. The
      # index once shipped with a helper deleted out from under it — a syntax
      # check passes on a missing global, so the code path has to be executed.
      - name: Test
        run: npm test

      - name: Build SEO landing pages
        run: npm run build:pages

      # Ask Cloudflare what the token can actually do, before wrangler tries.
      #
      # Wrangler reports every rejection as "Authentication error [code: 10000]"
      # and then prints an unrelated hint about User->User Details->Read. That
      # one message covers a token that is expired, a token scoped to a
      # different account, a wrong account ID, and a token missing Workers
      # permissions — four different fixes behind identical output, which is how
      # thirteen deploys failed without the cause being visible.
      #
      # These three probes separate them. Nothing here prints a secret: the
      # token is only ever sent in a header, and the account ID is compared
      # rather than echoed. The step never fails the job, so the deploy still
      # runs and its own error is still visible underneath.
      - name: Check the Cloudflare token before deploying
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          echo "1. Is the token itself valid?"
          v=$(api /user/tokens/verify)
          if [ "$(jq -r .success <<<"$v")" = "true" ]; then
            echo "   yes — status: $(jq -r .result.status <<<"$v")"
          else
            echo "   NO. The token is invalid, expired, or revoked."
            echo "   $(jq -c '.errors' <<<"$v")"
            echo "   Fix: issue a new token and update the CLOUDFLARE_API_TOKEN secret."
            exit 0
          fi

          echo "2. Can the token see the account in CLOUDFLARE_ACCOUNT_ID?"
          a=$(api /accounts)
          if [ "$(jq -r .success <<<"$a")" != "true" ]; then
            echo "   Could not list accounts: $(jq -c '.errors' <<<"$a")"
          elif jq -e --arg id "$CF_ACCOUNT" '.result[] | select(.id == $id)' >/dev/null <<<"$a"; then
            echo "   yes — $(jq -r --arg id "$CF_ACCOUNT" '.result[] | select(.id==$id) | .name' <<<"$a")"
          else
            echo "   NO. The token is scoped to $(jq -r '.result | length' <<<"$a") account(s),"
            echo "   none of which is the one in CLOUDFLARE_ACCOUNT_ID:"
            jq -r '.result[] | "     - \(.name) (\(.id))"' <<<"$a"
            echo "   Fix: point the secret at one of those, or widen the token's"
            echo "   Account Resources to include the account the Worker lives in."
            exit 0
          fi

          echo "3. Can the token read Workers scripts on that account?"
          w=$(api "/accounts/$CF_ACCOUNT/workers/scripts")
          if [ "$(jq -r .success <<<"$w")" = "true" ]; then
            echo "   yes — $(jq -r '.result | length' <<<"$w") script(s). The token has Workers access."
          else
            echo "   NO: $(jq -c '.errors' <<<"$w")"
            echo "   Token is valid and scoped to the right account, so this is the"
            echo "   missing piece: Account -> Workers Scripts -> Edit."
          fi

      # What this step needs from CLOUDFLARE_API_TOKEN:
      #
      #   Account -> Workers Scripts -> Edit
      #   Account -> D1 -> Edit
      #
      # Every deploy from 2026-08-23 onward failed because the token lost
      # Workers Scripts:Edit when D1 was added to it, and a token that cannot
      # write Workers fails the very first API call:
      #
      #   A request to the Cloudflare API (/accounts/.../workers/services/
      #   the-card-huddle) failed. Authentication error [code: 10000]
      #
      # Read that error, not the line under it. Wrangler follows a 10000 with a
      # generic "Are you missing the `User->User Details->Read` permission?"
      # hint, which sent this investigation down the wrong path twice: that
      # scope identifies the account for `wrangler secret put` and has nothing
      # to do with why a deploy is rejected. Twelve deploys failed while the
      # site quietly served August-23 code.
      #
      # Secrets are no longer pushed from here — separately worth doing, since
      # nothing about shipping a Worker requires it, but it was not the fix.
      # CARD_API_KEY and SOLD_PROVIDER stay set on the Worker from earlier
      # deploys: a deploy does not clear secrets it does not mention. To rotate
      # one, set it in the Cloudflare dashboard, or add User Details:Read to the
      # token and restore a `secrets:`/`env:` block here.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tells Bing, DuckDuckGo, Yandex, Naver and Seznam that pages changed
      # rather than waiting to be crawled. Google ignores IndexNow and has its
      # own machinery, so this is aimed at the non-Google half of search --
      # which is also what several AI assistants query.
      #
      # Last, and deliberately: submitting a URL before the new content is live
      # invites a crawl of the page it replaced. continue-on-error because a
      # search ping is never worth failing a release over, and the script only
      # submits pages whose sitemap <lastmod> actually moved -- re-submitting
      # thousands of unchanged URLs every deploy is how a host gets ignored.
      - name: Notify search engines of changed pages (IndexNow)
        run: node scripts/indexnow-submit.js
        continue-on-error: true
