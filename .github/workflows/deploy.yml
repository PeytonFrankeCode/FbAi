name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Manual trigger, so secrets can be pushed to the Worker without inventing a
  # commit — rotating a key doesn't otherwise change anything in the repo.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEO landing pages
        run: npm run build:pages

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pushes Worker secrets on deploy, so they can be managed from GitHub
          # instead of the Cloudflare dashboard. The conditional matters: when
          # the GitHub secret is unset this resolves to an empty list and the
          # step is skipped, rather than failing the whole deploy.
          secrets: ${{ secrets.CARD_API_KEY != '' && 'CARD_API_KEY' || '' }}
        env:
          # Read by wrangler-action for the names listed in `secrets` above.
          CARD_API_KEY: ${{ secrets.CARD_API_KEY }}
