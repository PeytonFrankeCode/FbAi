name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Manual trigger, so a deploy can be re-run without inventing a commit.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build:pages derives each sitemap <lastmod>
          # from the last commit that touched the underlying
          # checklist file. A shallow clone would date every page to
          # the deploy instead, which is the thing we are fixing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the index test builds its fixture with node:sqlite,
          # which does not exist before 22.5. Node 20 is also past deprecation
          # on GitHub runners.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs the index endpoints against a real in-memory SQLite dataset. The
      # index once shipped with a helper deleted out from under it — a syntax
      # check passes on a missing global, so the code path has to be executed.
      - name: Test
        run: npm test

      - name: Build SEO landing pages
        run: npm run build:pages

      # Secrets are NOT pushed from here any more, and that is what unblocked
      # deploys.
      #
      # wrangler-action's `secrets:` input runs `wrangler secret put`, which
      # first calls "Getting User settings..." to identify the account. That
      # call needs User -> User Details -> Read on the API token. Adding D1
      # permissions to the token narrowed it and dropped that scope, so every
      # deploy from 2026-08-23 onward failed identically:
      #
      #   Unable to retrieve email for this user.
      #   Are you missing the `User->User Details->Read` permission?
      #   Failed to upload secrets. / Action failed
      #
      # Twelve deploys failed that way while the site quietly served August-23
      # code. Nothing about pushing secrets is needed to ship a Worker, so the
      # step that requires the extra scope is gone rather than the permission
      # being chased: deploying now needs only what the token already has.
      #
      # CARD_API_KEY and SOLD_PROVIDER are already set on the Worker from
      # earlier deploys and are untouched by this — a deploy does not clear
      # secrets it does not mention. To rotate one, either set it in the
      # Cloudflare dashboard, or add User Details:Read back to the token and
      # restore the `secrets:`/`env:` block below.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tells Bing, DuckDuckGo, Yandex, Naver and Seznam that pages changed
      # rather than waiting to be crawled. Google ignores IndexNow and has its
      # own machinery, so this is aimed at the non-Google half of search --
      # which is also what several AI assistants query.
      #
      # Last, and deliberately: submitting a URL before the new content is live
      # invites a crawl of the page it replaced. continue-on-error because a
      # search ping is never worth failing a release over, and the script only
      # submits pages whose sitemap <lastmod> actually moved -- re-submitting
      # thousands of unchanged URLs every deploy is how a host gets ignored.
      - name: Notify search engines of changed pages (IndexNow)
        run: node scripts/indexnow-submit.js
        continue-on-error: true
