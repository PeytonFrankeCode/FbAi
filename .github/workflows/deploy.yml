name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Manual trigger, so a deploy can be re-run without inventing a commit.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build:pages derives each sitemap <lastmod>
          # from the last commit that touched the underlying
          # checklist file. A shallow clone would date every page to
          # the deploy instead, which is the thing we are fixing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the index test builds its fixture with node:sqlite,
          # which does not exist before 22.5. Node 20 is also past deprecation
          # on GitHub runners.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs the index endpoints against a real in-memory SQLite dataset. The
      # index once shipped with a helper deleted out from under it — a syntax
      # check passes on a missing global, so the code path has to be executed.
      - name: Test
        run: npm test

      - name: Build SEO landing pages
        run: npm run build:pages

      # Must run after build:pages, which regenerates the checklist index the
      # stamp hashes. The service worker keys its caches on this version, and it
      # sat at 'v1' for 137 commits — so returning visitors kept whatever app.js
      # and checklist index they first downloaded, indefinitely. Computing it
      # from content rather than trusting someone to remember is the fix; an
      # unchanged deploy produces the same stamp and evicts nobody.
      - name: Stamp the service worker cache version
        run: npm run build:sw

      # Ask Cloudflare what the token can actually do, before wrangler tries.
      #
      # Wrangler reports every rejection as "Authentication error [code: 10000]"
      # and then prints an unrelated hint about User->User Details->Read. That
      # one message covers a token that is expired, a token scoped to a
      # different account, a wrong account ID, and a token missing Workers
      # permissions — four different fixes behind identical output, which is how
      # thirteen deploys failed without the cause being visible.
      #
      # These three probes separate them. Nothing here prints a secret: the
      # token is only ever sent in a header, and the account ID is compared
      # rather than echoed. The step never fails the job, so the deploy still
      # runs and its own error is still visible underneath.
      - name: Check the Cloudflare token before deploying
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          echo "1. Is the token itself valid?"
          v=$(api /user/tokens/verify)
          if [ "$(jq -r .success <<<"$v")" = "true" ]; then
            # The token ID is an identifier, not a credential — it is what the
            # dashboard puts in the URL when you open a token to edit it. It is
            # printed so the token being edited can be matched against the one
            # this workflow is actually using, which is otherwise unknowable.
            echo "   yes — status: $(jq -r .result.status <<<"$v"), id: $(jq -r .result.id <<<"$v")"
          else
            echo "   NO. The token is invalid, expired, or revoked."
            echo "   $(jq -c '.errors' <<<"$v")"
            echo "   Fix: issue a new token and update the CLOUDFLARE_API_TOKEN secret."
            exit 0
          fi

          echo "2. Can the token see the account in CLOUDFLARE_ACCOUNT_ID?"
          a=$(api /accounts)
          if [ "$(jq -r .success <<<"$a")" != "true" ]; then
            echo "   Could not list accounts: $(jq -c '.errors' <<<"$a")"
          elif jq -e --arg id "$CF_ACCOUNT" '.result[] | select(.id == $id)' >/dev/null <<<"$a"; then
            echo "   yes — $(jq -r --arg id "$CF_ACCOUNT" '.result[] | select(.id==$id) | .name' <<<"$a")"
          else
            n=$(jq -r '.result | length' <<<"$a")
            if [ "$n" = "0" ]; then
              echo "   NO — and it can see no account at all. Account Resources is"
              echo "   empty, so the token grants no account access and no permission"
              echo "   ticked on it can take effect."
            else
              echo "   NO. The token reaches $n account(s), none of them that one:"
              jq -r '.result[] | "     - \(.name) (\(.id))"' <<<"$a"
            fi
            echo "   Fix: in the token's Account Resources, Include the account the"
            echo "   Worker lives in — or point CLOUDFLARE_ACCOUNT_ID at one it reaches."
          fi

          # Deliberately not conditional on step 2. An empty /accounts result is
          # not quite proof on its own — it is also what a token scoped to the
          # right account but without Account Settings:Read might return — and
          # the two have different fixes. This call settles it: it is the same
          # kind of account-scoped Workers request the deploy makes, so if it
          # succeeds the /accounts result was a red herring.
          echo "3. Can the token read Workers scripts on that account?"
          w=$(api "/accounts/$CF_ACCOUNT/workers/scripts")
          if [ "$(jq -r .success <<<"$w")" = "true" ]; then
            echo "   yes — $(jq -r '.result | length' <<<"$w") script(s). The token has Workers access."
          else
            echo "   NO: $(jq -c '.errors' <<<"$w")"
            echo "   This is the call the deploy fails on. Read it together with"
            echo "   step 2: if the account list was empty, fix the scope there"
            echo "   first — an empty scope rejects this call whatever permissions"
            echo "   the token carries. If step 2 passed, the missing piece is"
            echo "   Account -> Workers Scripts -> Edit."
          fi

          # D1 is not used by this workflow, so this check cannot fail the
          # deploy and is not here for the deploy's benefit.
          #
          # CLOUDFLARE_API_TOKEN is shared: fingerprint.yml runs `wrangler d1
          # execute --remote` with the same secret. A token rotated to fix a
          # deploy is easy to create from the "Edit Cloudflare Workers"
          # template, which covers Workers and not D1 — so the deploy goes green
          # and the photo job breaks, on a schedule nobody is watching, with the
          # cause weeks behind by the time it surfaces. Checking it here is the
          # only moment someone is actually looking.
          echo "4. Can the token reach D1? (not used here — fingerprint.yml needs it)"
          d=$(api "/accounts/$CF_ACCOUNT/d1/database")
          if [ "$(jq -r .success <<<"$d")" = "true" ]; then
            echo "   yes — $(jq -r '.result | length' <<<"$d") database(s)."
          else
            echo "   NO: $(jq -c '.errors' <<<"$d")"
            echo "   This deploy is unaffected, but fingerprint.yml will fail."
            echo "   Fix: add Account -> D1 -> Edit to the same token."
          fi

      # What this step needs from CLOUDFLARE_API_TOKEN:
      #
      #   Account -> Workers Scripts -> Edit
      #   Account -> D1 -> Edit
      #
      # ...but permissions are only half of it. The token also has to be scoped
      # to the account, under Account Resources. A token can carry every
      # permission in the list and still be rejected from everything if that
      # scope is empty, which is what happened here: the preflight above found
      # an active token that could reach zero accounts.
      #
      # Wrangler shows all of it as one line:
      #
      #   A request to the Cloudflare API (/accounts/.../workers/services/
      #   the-card-huddle) failed. Authentication error [code: 10000]
      #
      # and then adds a "Are you missing the `User->User Details->Read`
      # permission?" hint that is unrelated — that scope is only used by
      # `wrangler secret put`. Fourteen deploys failed behind that one message
      # while the site quietly served August-23 code, and the cause was guessed
      # wrong twice before the preflight was written to just ask.
      #
      # Secrets are no longer pushed from here — separately worth doing, since
      # nothing about shipping a Worker requires it, but it was not the fix.
      # CARD_API_KEY and SOLD_PROVIDER stay set on the Worker from earlier
      # deploys: a deploy does not clear secrets it does not mention. To rotate
      # one, set it in the Cloudflare dashboard, or add User Details:Read to the
      # token and restore a `secrets:`/`env:` block here.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tells Bing, DuckDuckGo, Yandex, Naver and Seznam that pages changed
      # rather than waiting to be crawled. Google ignores IndexNow and has its
      # own machinery, so this is aimed at the non-Google half of search --
      # which is also what several AI assistants query.
      #
      # Last, and deliberately: submitting a URL before the new content is live
      # invites a crawl of the page it replaced. continue-on-error because a
      # search ping is never worth failing a release over, and the script only
      # submits pages whose sitemap <lastmod> actually moved -- re-submitting
      # thousands of unchanged URLs every deploy is how a host gets ignored.
      - name: Notify search engines of changed pages (IndexNow)
        run: node scripts/indexnow-submit.js
        continue-on-error: true
