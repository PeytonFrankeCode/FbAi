name: Fingerprint card photos

# The photo work runs here rather than in the Worker, and that is the point.
# A Worker cannot decode a JPEG, so the first attempt asked Cloudflare's image
# service to shrink each photo to a PNG — which failed on every row in
# production, because the resizer is a paid zone feature. At ~340,000 images
# the per-image billing is not small either.
#
# None of it was necessary. This is a batch backfill, not a request: it has no
# business running somewhere with a 30-second CPU ceiling, no image libraries,
# and a bundle size that can take the whole site down. A runner is a plain Node
# machine, the decoder is one devDependency that never reaches the Worker, and
# the only limit is wall-clock.

on:
  # Also on every merge to main. The manual "Run workflow" button does not exist
  # on GitHub's mobile site, so requiring a click to try a fix meant the fix
  # could only be tried from a desktop — and re-running an old run from a phone
  # replays the old commit, which silently reproduced a bug that had already
  # been fixed. Merging is the action that already happens; hang the job off
  # that instead. It exits in seconds when there is nothing left to fetch.
  push:
    branches: [main]
    paths:
      - 'scripts/fingerprint-photos.js'
      - 'scripts/build-photo-refs.js'
      - 'scripts/probe-ebay-aspects.js'
      - 'photo-signature.js'
      - '.github/workflows/fingerprint.yml'
  schedule:
    # Hourly. The repository is public, so Actions minutes are free and there is
    # no reason to ration them: at 1,500 photos every six hours the backfill of
    # ~149,000 references would have taken 25 days. At 4,000 hourly it is closer
    # to a day and a half, and an overnight run gets through ~32,000.
    #
    # The ceiling here is politeness to eBay, not GitHub. Twelve concurrent
    # fetches of a 3 KB thumbnail is roughly 25 a second for about three minutes
    # per run — a rounding error to an image CDN, and rate limiting is handled
    # anyway: a 429 is classed transient, left unwritten, and retried.
    #
    # Once the backfill is done these runs find nothing and exit in seconds.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      probe_aspects:
        description: 'Also probe eBay item specifics (yes/no)'
        required: false
        default: 'no'
      limit:
        description: 'How many photos to fetch this run'
        required: false
        default: '4000'

# One at a time. Two runs would fetch the same rows, since a row is only
# excluded once it has been written.
concurrency:
  group: fingerprint-photos
  cancel-in-progress: false

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and fingerprint
        run: node scripts/fingerprint-photos.js --limit=${{ github.event.inputs.limit || '4000' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rebuild the references and re-measure every run. The hold-out accuracy
      # is the number that decides whether any of this may touch a blank card,
      # and it moves as the library grows -- a verdict from 1,500 photos is not
      # the verdict from 149,000, so it is worth recomputing rather than
      # deciding once and trusting it forever.
      - name: Build references and measure accuracy
        run: node scripts/build-photo-refs.js --write
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # A separate job, on demand only. It answers a question rather than filling a
  # table: do the sold listings still carry eBay's structured "Parallel" field
  # on the sales where our column is blank? If they do, the answer was always
  # there for free and no image recognition -- built or bought -- was needed to
  # reconstruct it. Small sample, low concurrency: it is a probe, and they are
  # someone else's servers.
  probe-aspects:
    # Runs when the probe script itself changes, or on demand. The manual input
    # alone would have been useless: GitHub's mobile site has no "Run workflow"
    # button, so gating a one-off question behind a button nobody can press is
    # how the WebP bug survived two rounds of "just re-run it".
    if: >-
      github.event.inputs.probe_aspects == 'yes' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, 'probe-ebay-aspects'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Probe eBay item specifics
        run: node scripts/probe-ebay-aspects.js --limit=150
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
