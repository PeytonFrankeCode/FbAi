name: Collect sold sales from The Card API (nightly)

# Yesterday's football, baseball and basketball sales from The Card API,
# straight into the nflcarddb D1 database -- no PC involved. See
# scripts/collect-sold-cardapi.py for how and why.
#
# Daily at 7:00 AM Eastern (12:00 UTC), for the day before yesterday,
# which the vendor has finished indexing.
# Also runs when the script changes: (GitHub's mobile site has no "Run
# workflow" button): on any branch but main, as a dry run.
#
# Repo Settings -> Secrets and variables -> Actions:
#   Secret   CARD_API_KEY        the API key (already set)
#   Variable CARDAPI_PLAN        the plan the key is on. Default starter (owner
#                                subscribed 25 Nov 2026); set it to "free" to
#                                stop uploads (the free key is evaluation only).
#   Variable CARDAPI_MIN_PRICE   lowest sale price in dollars (default: the lowest
#                                that fits the day's rows)
#   Variable CARDAPI_PURGE       1 to delete every Card API sale (after cancelling)

on:
  schedule:
    # Every morning around 7 AM Eastern (owner, Nov 2026). GitHub starts
    # scheduled runs late when it's busy, worst at the top of the hour (the
    # 12:00 UTC run on 26 Nov started at 20:35), so it's asked five times at
    # quiet minutes, 11:17-13:17 UTC. The first that starts collects; the rest
    # find the day's rows spent and stop at once (a 429 costs nothing).
    - cron: '17 11 * * *'
    - cron: '43 11 * * *'
    - cron: '17 12 * * *'
    - cron: '43 12 * * *'
    - cron: '17 13 * * *'
  push:
    paths:
      - scripts/collect-sold-cardapi.py
      - scripts/cardapi-replay.txt
      - .github/workflows/collect-sold-cardapi.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # to download a saved run's sales for a replay

concurrency:
  group: collect-sold-cardapi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PeytonFrankeCode/NflCardDB
          path: nflcarddb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q ./nflcarddb requests
      # Replay: put a run id in scripts/cardapi-replay.txt and push it to main.
      # That run's saved sales are uploaded without spending any rows. Only a
      # push replays; the daily schedule always collects.
      - name: Which saved run to replay
        id: replay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "run=$(grep -Eo '^[0-9]{6,}' scripts/cardapi-replay.txt 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Download its saved sales
        if: steps.replay.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: cardapi-raw-*
          path: replay
          merge-multiple: true
          run-id: ${{ steps.replay.outputs.run }}
          github-token: ${{ github.token }}
      - name: Collect and upload
        run: python scripts/collect-sold-cardapi.py
        env:
          CARD_API_KEY: ${{ secrets.CARD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARDAPI_PLAN: ${{ vars.CARDAPI_PLAN || 'starter' }}
          CARDAPI_MIN_PRICE: ${{ vars.CARDAPI_MIN_PRICE || '' }}
          CARDAPI_PURGE: ${{ github.ref == 'refs/heads/main' && (vars.CARDAPI_PURGE || '') || '' }}
          DRY_RUN: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '1' || '0' }}
          CARDAPI_RAW_DIR: raw
          # A change to the collector, pushed to main, re-checks what's stored
          # under its current rules (sport, photos) before collecting.
          CARDAPI_FIX: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
          CARDAPI_REPLAY_DIR: ${{ steps.replay.outputs.run != '' && 'replay' || '' }}
      # Every page this run fetched, kept 30 days, so its sales can be replayed.
      - name: Save the fetched sales
        if: always() && hashFiles('raw/*.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cardapi-raw-${{ github.run_id }}
          path: raw/
          retention-days: 30
