name: Live site check (one-off, never merge)
on:
  push:
    branches: ['run/movers-short']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 5
          curl -sS -m 90 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131' "https://the-card-huddle.thecardhuddleoffical.workers.dev/api/debug/auction-pilot" | head -c 6000; echo
