name: Email check (one-off, never merge)
on:
  push:
    branches: ['run/movers-short']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://the-card-huddle.thecardhuddleoffical.workers.dev
          echo "== health"; curl -sS -m 40 "$B/api/health" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('integrations',{}).get('email')))"
          echo "== usage"; curl -sS -m 40 "$B/api/ai/usage" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: d.get(k) for k in ('trialReminders','trialEligible','trialDays')})"
          echo "== build"; curl -sS -m 20 "$B/build.json"; echo
