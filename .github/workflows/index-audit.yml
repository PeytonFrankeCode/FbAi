name: Index audit (one-off)
on:
  push:
    branches: ['run/index-audit']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Read the price map
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .cache
          NS=$(awk '/^\[\[kv_namespaces\]\]/{f=1} f && /^id *=/{gsub(/[" ]/,"",$0); sub(/^id=/,"",$0); print; exit}' wrangler.toml)
          curl -sS -o .cache/priceblocks.json -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$NS/values/priceblocks%3Av1"
          node -e "const d=JSON.parse(require('fs').readFileSync('.cache/priceblocks.json','utf8'));const p={};for(const[k,v]of Object.entries(d.pages||{}))p[k]={sales:v&&v.sales||1};require('fs').writeFileSync('.cache/priced-keys.json',JSON.stringify({built:d.built,pages:p}))"
      - run: npm run build:pages > /dev/null
      - name: Audit
        run: |
          node -e "
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('.cache/priceblocks.json','utf8'));
          const pages=d.pages||{};
          const out=[];
          out.push('price map built '+d.built+' from '+d.from+' to '+d.to+'; '+Object.keys(pages).length+' priced pages');
          const players=fs.readdirSync('public/players').filter(s=>fs.existsSync('public/players/'+s+'/index.html'));
          const unpriced=players.filter(s=>!pages['player:'+s]);
          out.push('built player pages '+players.length+', unpriced '+unpriced.length);
          const sets=fs.readdirSync('public/sets').filter(s=>fs.existsSync('public/sets/'+s+'/index.html')&&!/^\d{4}/.test(s)===false||true).filter(s=>fs.existsSync('public/sets/'+s+'/index.html'));
          out.push('built set pages '+sets.length+', unpriced '+sets.filter(s=>!/^\d{4}$/.test(s)&&!pages['set:'+s]).length);
          const ex=pages['player:justin-jefferson']; out.push('sample entry keys: '+JSON.stringify(ex?Object.keys(ex):null)+' sales '+(ex&&ex.sales));
          const near=Object.entries(pages).filter(([k,v])=>k.startsWith('player:')).map(([k,v])=>v.sales).sort((a,b)=>a-b);
          out.push('priced player sales min '+near[0]+' median '+near[Math.floor(near.length/2)]);
          out.push('UNPRICED PLAYERS:'); out.push(unpriced.join(' '));
          fs.writeFileSync('audit.txt',out.join('\n')+'\n');
          console.log(out.slice(0,6).join('\n'));
          "
      - name: Debug coverage for named players
        run: |
          for p in christian-mccaffrey travis-kelce randy-moss arch-manning jalen-coker brian-burns tom-brady patrick-mahomes-ii; do
            echo "== $p" >> audit.txt
            curl -sS -m 30 "https://the-card-huddle.thecardhuddleoffical.workers.dev/api/debug/price-coverage?player=$p" 2>&1 | head -c 600 >> audit.txt || true
            echo >> audit.txt
          done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "audit/${GITHUB_RUN_ID}"; git add -f audit.txt; git commit -qm audit; git push -q origin "audit/${GITHUB_RUN_ID}"
