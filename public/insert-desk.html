<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Insert desk</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --line: #242c35; --ink: #e7edf3;
    --dim: #8b98a5; --accent: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line);
           display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { padding: 20px; max-width: 880px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; }
  .phrase { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .samples { margin-top: 12px; }
  .samples div { color: var(--dim); font-size: 12px; font-style: italic;
                 overflow-wrap: anywhere; margin-bottom: 3px; }
  .shots { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .shots img { width: 104px; height: 145px; object-fit: cover; border-radius: 6px;
               background: #0b0e11; border: 1px solid var(--line); display: block; }
  .shot { margin: 0; width: 104px; cursor: pointer; }
  .shot.on img { border-color: var(--accent); }
  .shot figcaption { font-size: 11px; color: var(--dim); margin-top: 4px;
                     line-height: 1.25; overflow-wrap: anywhere; }
  .shot.on figcaption { color: var(--accent); }
  .noshots { color: var(--dim); font-size: 12px; margin-top: 12px; }
  ol { list-style: none; padding: 0; margin: 18px 0 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 7px;
       border: 1px solid transparent; cursor: pointer; }
  li:hover { background: #1d242c; }
  li.sel { border-color: var(--accent); background: #16241c; }
  kbd { background: #0b0e11; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 7px; font: 12px/1.6 ui-monospace, monospace;
        color: var(--dim); min-width: 22px; text-align: center; }
  .pname { flex: 1; }
  .keys { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex;
          gap: 16px; flex-wrap: wrap; }
  .done { text-align: center; padding: 60px 20px; color: var(--dim); }
  .done b { color: var(--accent); }
  #flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
           background: #16241c; border: 1px solid var(--accent); color: var(--accent);
           padding: 9px 18px; border-radius: 7px; font-size: 13px; opacity: 0;
           transition: opacity .18s; pointer-events: none; }
  #flash.bad { background: #2a1616; border-color: var(--bad); color: var(--bad); }
  #flash.on { opacity: 1; }
  input[type=text] { width: 100%; margin-top: 12px; padding: 9px 12px; border-radius: 7px;
                     background: #0b0e11; border: 1px solid var(--line); color: var(--ink);
                     font: inherit; }
  .hint { color: var(--warn); font-size: 12px; margin-top: 10px; }
  .scoped { font-size: 15px; font-weight: 400; color: var(--warn); }
  .splits { margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--line);
            border-radius: 8px; }
  .splits-h { color: var(--warn); font-size: 12px; margin-bottom: 6px; }
  .split { padding: 4px 2px; font-size: 13px; color: var(--dim); cursor: pointer;
           border-radius: 5px; }
  .split:hover { background: #1d242c; }
  .split.on { color: var(--ink); }
  .split.on kbd { border-color: var(--accent); color: var(--accent); }
  .split-n { font-variant-numeric: tabular-nums; }
  .tick { display: inline-block; width: 1em; color: var(--accent); }
  .cands { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px;
           overflow: hidden; }
  .cand { padding: 7px 12px; font-size: 14px; color: var(--dim); cursor: pointer; }
  .cand:hover { background: #1d242c; }
  .cand.on { background: #16241c; color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
  .cand-more { padding: 6px 12px; font-size: 12px; color: var(--dim);
               border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Insert desk</h1>
  <span class="stat">open cards <b id="s-open">–</b></span>
  <span class="stat">sales held up <b id="s-held">–</b></span>
  <span class="stat">per decision <b id="s-per">–</b></span>
  <span class="stat">decided <b id="s-done">–</b></span>
  <span class="stat" id="s-as-of"></span>
</header>
<main id="main"><p class="stat">Loading…</p></main>
<div id="flash"></div>

<script>
// The insert desk deals in CARDS, and the unit is the whole difference.
//
// The parallel desk can queue phrases because resolveParallel hands back the
// exact segment it could not place. resolveSubset cannot: it searches the whole
// title for any catalogued set name, so when it fails there is no phrase to
// blame — the residue is the entire title.
//
// So the unit here is one (product, player, number) that the catalogue says
// belongs to more than one set. 2017 Prizm lists Dalvin Cook #8 in both Prizm
// Premier Jerseys and Stained Glass Prizm, and a title naming neither is
// genuinely undecidable from text. The candidates are short, the photo settles
// it, and every sale of that card shares the answer.
//
// The header shows sales-per-decision live, because if it stops being large
// this screen is not worth anyone's evening.
const qs = new URLSearchParams(location.search);
const KEY = qs.get('key') || '';
let queue = [], at = 0, sel = 0, done = 0, fixed = 0;

// WHICH PLACES THIS ANSWER APPLIES TO.
//
// A phrase does not mean one thing: "signatures" turned up across two products
// at once, and inside one product a Signatures auto and a Signatures /25 are
// different cards wearing identical words.
//
// A SET rather than one index, because the places often fall into groups — two
// products where the phrase means the same parallel and a third where it does
// not. Picking one at a time would work and would be tedious.
//
// Empty means something different from "all picked", and the difference
// matters: empty writes ONE global decision that also covers products not in
// this list and months not yet collected, while picking every row writes one
// decision each and says nothing about anywhere else.
let picked = new Set();
// Which suggestion is highlighted, and what has been typed to filter them.
let cand = 0, typed = '';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// WHEN, ON TWO CLOCKS.
//
// A report has two ages and they come apart: when it was built, and how recent
// the sales inside it are. A queue built a minute ago on sales that stop five
// days back is stale, and the build time alone says the opposite. So both are
// shown, and neither is inferred from the other.
//
// Every field is optional. A desk that blanks its header because a date was
// missing would be worse than one that says nothing about dates at all.
function asOf(d) {
  const bits = [];
  const w = d && d.window;
  const through = w && w.through ? String(w.through).slice(0, 10) : '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(through)) {
    const [y, m, day] = through.split('-').map(Number);
    const days = Math.floor((Date.now() - Date.UTC(y, m - 1, day)) / 86400000);
    bits.push('sales through ' + through +
      (days > 1 ? ' (' + days + 'd ago)' : ''));
  }
  const built = Date.parse((d && d.generatedAt) || '');
  if (Number.isFinite(built)) {
    const mins = Math.max(0, Math.round((Date.now() - built) / 60000));
    bits.push('built ' + (mins < 1 ? 'just now'
      : mins < 60 ? mins + 'm ago'
      : mins < 1440 ? Math.round(mins / 60) + 'h ago'
      : Math.round(mins / 1440) + 'd ago'));
  }
  return bits.join(' · ');
}

// EVERY PHOTO SAYS WHICH TITLE IT CAME FROM.
//
// Not so the parallels can be told apart — the split list above already names
// each one. So that a WONKY one can be spotted: a photo tagged X-Fractor
// showing a card that is plainly a Hyper means that title is carrying sales it
// should not, and no amount of answering the card correctly fixes it.
//
// Pooled and unlabelled, that mismatch is invisible. A 2025 Topps Chrome Jaxson
// Dart #306 showed four photos in a row drawn from four different titles with
// nothing on screen tying a photo to a title, so the one photo that disagreed
// with its label looked exactly like the three that agreed.
//
// Round-robin across the titles, not the first four photos in order: taking
// them in order fills the strip from whichever title sold most and hides the
// rest completely, which is how a wonky title stays hidden.
function shotStrip(item, splits, chosen) {
  const from = (chosen.length ? chosen.map(i => splits[i]) : splits)
    .filter(sp => sp && (sp.photos || []).length);
  // No per-title photos — fall back to the pooled ones, unlabelled rather than
  // labelled wrongly.
  if (!from.length) return (item.photos || []).map(u => ({ url: u, at: -1, tag: '' }));

  // The labels share a long prefix: same product, same player, same number on
  // every row. The tail is the whole difference, so the shared head is cut and
  // only what distinguishes them is shown.
  const labels = from.map(sp => String(sp.label || ''));
  let cut = 0;
  if (from.length > 1) {
    const a = labels[0];
    while (cut < a.length && labels.every(t => t[cut] === a[cut])) cut++;
    while (cut > 0 && !/\s/.test(a[cut - 1])) cut--;   // never start mid-word
  }

  const out = [];
  for (let k = 0; k < 4; k++) {
    from.forEach((sp, j) => {
      if (!sp.photos[k]) return;
      out.push({
        url: sp.photos[k],
        at: splits.indexOf(sp),
        tag: from.length > 1 ? (labels[j].slice(cut) || labels[j]).trim() : '',
      });
    });
  }
  return out.slice(0, 12);
}

function flash(msg, bad) {
  const f = $('flash');
  f.textContent = msg;
  f.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { f.className = bad ? 'bad' : ''; }, 1800);
}

async function load() {
  const r = await fetch('/api/review/inserts?key=' + encodeURIComponent(KEY) + '&days=90');
  const d = await r.json();
  if (!d.available) {
    $('main').innerHTML = '<p class="stat">' +
      esc(d.error || d.reason || 'Unavailable — check the admin key in the URL.') + '</p>';
    return;
  }
  queue = d.queue || [];
  $('s-open').textContent = (d.openCards || 0).toLocaleString();
  $('s-held').textContent = (d.salesHeldUp || 0).toLocaleString();
  $('s-per').textContent = (d.salesPerDecision || 0).toLocaleString();
  $('s-done').textContent = (d.decisionsInPlace || 0).toLocaleString();
  $('s-as-of').textContent = asOf(d);
  render();
}

function render() {
  const item = queue[at];
  if (!item) {
    $('main').innerHTML = '<div class="done"><p><b>Queue clear.</b></p>' +
      '<p class="stat">' + done + ' decided, ' + fixed.toLocaleString() +
      ' sales resolved this session.</p></div>';
    return;
  }

  const splits = item.splits || [];
  const chosen = [...picked].filter(i => splits[i]).sort((a, b) => a - b);
  // One picked place shows its own photos; several or none show the phrase's.
  const view = chosen.length === 1 ? splits[chosen[0]] : item;
  // Labelled, and clickable: seeing that three of these are refractors and one
  // is a Hyper is the whole job, and the answer applies to whichever ones are
  // picked.
  const shots = shotStrip(item, splits, chosen);
  const scopeLabel = chosen.length === 0 ? null
    : chosen.length === 1 ? splits[chosen[0]].label
    : chosen.length + ' of ' + splits.length + ' places';
  const pickedSales = chosen.length
    ? chosen.reduce((n, i) => n + splits[i].sales, 0) : (item.sales || 0);

  // Filtered on every typed word, so "gold ref" finds "Gold Interstellar
  // Refractors" — nobody types a parallel's full name from memory.
  const words = typed.toLowerCase().split(/\s+/).filter(Boolean);
  const all = (item.candidates || []).filter(c => {
    const low = (c.name + ' ' + c.category).toLowerCase();
    return words.every(w => low.includes(w));
  });
  const matches = all.slice(0, 8);
  const more = all.length - matches.length;

  $('main').innerHTML =
    '<div class="card">' +
      '<div class="phrase">' + esc(item.label) +
        (scopeLabel ? '<span class="scoped"> in ' + esc(scopeLabel) + '</span>' : '') +
      '</div>' +
      '<div class="meta"><b>' + pickedSales.toLocaleString() + '</b> sales' +
        (chosen.length === 0 && item.value ? ' &middot; $' + item.value.toLocaleString() + ' traded' : '') +
        ' &middot; ' + (queue.length - at) + ' left' + '</div>' +
      // Where the phrase could mean different things. One row means one
      // meaning and a single decision covers it; several mean look first.
      (splits.length > 1
        ? '<div class="splits">' +
            '<div class="splits-h">Sold under ' + splits.length + ' different titles &mdash; ' +
              'press a number to pick the ones this answer applies to' +
              (chosen.length ? '' : ', or answer with none picked to apply everywhere') +
              ':</div>' +
            splits.map((sp, i) =>
              '<div class="split' + (picked.has(i) ? ' on' : '') + '" data-s="' + i + '">' +
                '<kbd>' + (i + 1) + '</kbd> ' +
                '<span class="tick">' + (picked.has(i) ? '&#10003;' : '&nbsp;') + '</span> ' +
                esc(sp.label) +
                ' <span class="split-n">' + sp.sales.toLocaleString() + ' sales</span>' +
              '</div>').join('') +
            '<div class="split" data-s="-2"><kbd>A</kbd> ' +
              '<span class="tick">&nbsp;</span> ' +
              (chosen.length === splits.length ? 'clear all' : 'pick every place') + '</div>' +
          '</div>'
        : '') +
      (shots.length
        ? '<div class="shots">' + shots.map(s =>
            '<figure class="shot' + (s.at >= 0 && picked.has(s.at) ? ' on' : '') + '"' +
              (s.at >= 0 ? ' data-s="' + s.at + '"' : '') + '>' +
              '<img src="' + esc(s.url) + '" alt="" loading="lazy" ' +
              'onerror="this.closest(\'figure\').style.visibility=\'hidden\'" />' +
              (s.tag ? '<figcaption>' + esc(s.tag) + '</figcaption>' : '') +
            '</figure>').join('') + '</div>'
        : '<div class="noshots">No photos stored for this one.</div>') +
      '<div class="samples">' +
        (view.samples || []).map(t => '<div>' + esc(t) + '</div>').join('') +
      '</div>' +
      // Only two options, because there are only two answers. Naming the
      // parallel is a typing job, not a pick-from-a-list one: the catalogue
      // holds thousands and the right one is whatever the card actually says.
      '<ol id="opts">' +
        '<li class="' + (sel === 0 ? 'sel' : '') + '" data-i="0">' +
          '<kbd>X</kbd><span class="pname">Not an insert &mdash; the base card' +
          (scopeLabel ? ' <em>in ' + esc(scopeLabel) + '</em>'
                      : (splits.length > 1 ? ' <em>everywhere</em>' : '')) + '</span></li>' +
        '<li class="' + (sel === 1 ? 'sel' : '') + '" data-i="1">' +
          '<kbd>Enter</kbd><span class="pname">Pick the set it belongs to' +
          (scopeLabel ? ' <em>for ' + esc(scopeLabel) + '</em>'
                      : (splits.length > 1 ? ' <em>for everywhere</em>' : '')) + '</span></li>' +
      '</ol>' +
      '<input type="text" id="manual" placeholder="type to filter the sets below" ' +
        'autocomplete="off" value="' + esc(typed) + '" />' +
      // The candidate sets, from this product's own checklist. There are
      // usually two or three and the photo tells them apart in a second — the
      // answer is on the page, it does not have to be remembered.
      (matches.length
        ? '<div class="cands">' +
            matches.map((c, i) =>
              '<div class="cand' + (i === cand ? ' on' : '') + '" data-c="' + esc(c.id) + '">' +
                esc(c.name) + ' <span class="split-n">' + esc(c.category) + '</span></div>').join('') +
          '</div>'
        : '<p class="hint">No candidate sets found for this card. That means the ' +
          'checklist does not list it under more than one set, and there is ' +
          'nothing here to decide.</p>') +
      '<div class="keys">' +
        '<span><kbd>X</kbd> base card</span>' +
        '<span><kbd>&uarr;</kbd><kbd>&darr;</kbd> pick a set</span>' +
        '<span><kbd>Enter</kbd> save it</span>' +
        (splits.length > 1 ? '<span><kbd>1</kbd>–<kbd>9</kbd> pick places</span>' +
                             '<span><kbd>A</kbd> pick all</span>' +
                             '<span><kbd>0</kbd> clear</span>' : '') +
        '<span><kbd>S</kbd> skip</span>' +
      '</div>' +
    '</div>';

  document.querySelectorAll('.split').forEach(el => {
    el.onclick = () => { toggle(Number(el.dataset.s)); };
  });
  // A photo is the fastest way to say "that one, not the others" — it is what
  // is actually being looked at when the difference is spotted.
  document.querySelectorAll('.shot[data-s]').forEach(el => {
    el.onclick = () => { toggle(Number(el.dataset.s)); };
  });
  document.querySelectorAll('.cand').forEach(el => {
    el.onclick = () => { decide(el.dataset.c); };
  });
  // Typing re-renders the list, so focus has to be put back or the second
  // keystroke goes nowhere.
  const box = $('manual');
  if (box) {
    box.oninput = () => { typed = box.value; cand = 0; render(); };
    if (typed) { box.focus(); box.setSelectionRange(typed.length, typed.length); }
  }
  document.querySelectorAll('#opts li').forEach(el => {
    el.onclick = () => {
      sel = Number(el.dataset.i);
      if (sel === 0) decide('');
      else $('manual').focus();
    };
  });
}

// -2 is the pick-all row, -1 clears.
function toggle(i) {
  const splits = (queue[at] || {}).splits || [];
  if (i === -2) {
    if (picked.size === splits.length) picked.clear();
    else splits.forEach((_, k) => picked.add(k));
  } else if (i < 0) {
    picked.clear();
  } else if (picked.has(i)) {
    picked.delete(i);
  } else {
    picked.add(i);
  }
  render();
}

async function send(item, setId, sp) {
  const r = await fetch('/api/review/inserts?key=' + encodeURIComponent(KEY), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      productId: item.productId,
      player: item.player,
      cardNumber: item.cardNumber,
      setId,
      // A title scopes the answer to sales carrying it. Without one the answer
      // covers the whole card, including titles not collected yet.
      title: sp ? sp.title : undefined,
    }),
  });
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, d };
}

async function decide(parallel) {
  const item = queue[at];
  if (!item) return;
  const splits = item.splits || [];
  const chosen = [...picked].filter(i => splits[i]).sort((a, b) => a - b);

  // Nothing picked means the answer holds everywhere — one decision, and it
  // covers products not on this list and months not yet collected. Picking
  // every row instead writes one decision each and says nothing about
  // anywhere else. They are different statements and both are wanted.
  const jobs = chosen.length ? chosen.map(i => splits[i]) : [null];

  let okCount = 0, coveredSales = 0, lastTotal = null, firstError = null;
  for (const sp of jobs) {
    const { ok, d } = await send(item, parallel, sp);
    if (!ok) { firstError = firstError || d.error || 'Failed'; continue; }
    okCount++;
    coveredSales += sp ? sp.sales : (item.sales || 0);
    lastTotal = d.total;
  }

  // A refusal must not look like a success. If the name is not in any
  // checklist every job fails, and saying "+0 sales" would read as done.
  if (!okCount) { flash(firstError || 'Failed', true); return; }

  done += okCount;
  fixed += coveredSales;
  if (lastTotal != null) $('s-done').textContent = lastTotal.toLocaleString();
  flash('+' + coveredSales.toLocaleString() + ' sales \u2192 ' + (parallel ? 'that set' : 'base card') +
        (chosen.length ? ' (' + okCount + ' of ' + splits.length + ' places)' : '') +
        (firstError ? ' \u2014 some failed' : ''));

  // Answered places leave the phrase; the rest keep it open. Advancing while
  // splits are still undecided would silently abandon them.
  if (chosen.length) {
    const doneSet = new Set(chosen);
    item.splits = splits.filter((_, i) => !doneSet.has(i));
    item.sales = Math.max(0, (item.sales || 0) - coveredSales);
    picked.clear();
    if (item.splits.length === 0) { at++; }
  } else {
    picked.clear();
    at++;
  }
  sel = 0; typed = ''; cand = 0; render();
}

document.addEventListener('keydown', (e) => {
  const box = document.getElementById('manual');
  if (document.activeElement === box) {
    const list = document.querySelectorAll('.cand');
    if (e.key === 'ArrowDown') { cand = Math.min(list.length - 1, cand + 1); render(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { cand = Math.max(0, cand - 1); render(); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      // The highlighted suggestion wins over the raw text, because the
      // suggestion is a name the catalogue actually has and the typed text is
      // usually a fragment of it.
      const hit = list[cand];
      // Always the picked set's id. There is no free-text answer here: a set
      // this product does not have is refused, so typing one would only ever
      // produce an error.
      if (hit) { decide(hit.dataset.c); }
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape') { typed = ''; box.blur(); render(); }
    return;
  }
  if (!queue[at]) return;
  const splits = queue[at].splits || [];
  if (e.key >= '1' && e.key <= '9' && splits.length > 1) {
    const i = Number(e.key) - 1;
    if (i < splits.length) toggle(i);
    return;
  }
  if (e.key === '0') { toggle(-1); return; }
  if (e.key.toLowerCase() === 'a' && splits.length > 1) { toggle(-2); return; }
  if (e.key.toLowerCase() === 'x') { decide(''); }
  else if (e.key === 'Enter') { box && box.focus(); e.preventDefault(); }
  else if (e.key.toLowerCase() === 's') { at++; sel = 0; render(); }
});

load();
</script>
</body>
</html>
