<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Sorting desk</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --line: #242c35; --ink: #e7edf3;
    --dim: #8b98a5; --accent: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line);
           display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .stat { color: var(--dim); font-size: 13px; }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { padding: 20px; max-width: 880px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; }
  .spelling { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .sample { color: var(--dim); font-size: 12px; margin-top: 10px; font-style: italic;
            overflow-wrap: anywhere; }
  ol { list-style: none; padding: 0; margin: 18px 0 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 7px;
       border: 1px solid transparent; cursor: pointer; }
  li:hover { background: #1d242c; }
  li.sel { border-color: var(--accent); background: #16241c; }
  kbd { background: #0b0e11; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 7px; font: 12px/1.6 ui-monospace, monospace;
        color: var(--dim); min-width: 22px; text-align: center; }
  .pname { flex: 1; }
  .pid { color: var(--dim); font: 11px ui-monospace, monospace; }
  .keys { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex;
          gap: 16px; flex-wrap: wrap; }
  .done { text-align: center; padding: 60px 20px; color: var(--dim); }
  .done b { color: var(--accent); }
  #flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
           background: #16241c; border: 1px solid var(--accent); color: var(--accent);
           padding: 9px 18px; border-radius: 7px; font-size: 13px; opacity: 0;
           transition: opacity .18s; pointer-events: none; }
  #flash.bad { background: #2a1616; border-color: var(--bad); color: var(--bad); }
  #flash.on { opacity: 1; }
  input[type=text] { width: 100%; margin-top: 12px; padding: 9px 12px; border-radius: 7px;
                     background: #0b0e11; border: 1px solid var(--line); color: var(--ink);
                     font: inherit; }
  .hint { color: var(--warn); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Sorting desk</h1>
  <span class="stat">open <b id="s-open">–</b></span>
  <span class="stat">sales held up <b id="s-held">–</b></span>
  <span class="stat">per decision <b id="s-per">–</b></span>
  <span class="stat">aliases <b id="s-alias">–</b></span>
</header>
<main id="main"><p class="stat">Loading…</p></main>
<div id="flash"></div>

<script>
// The desk deals in SET SPELLINGS, not cards, and that is the whole design.
//
// A month's sample holds ~15,900 sales across 4,000 titles, so a decision about
// one title is worth about four sales and there are ~200,000 titles. A decision
// about one (year, set name) is worth every sale ever filed under that
// spelling. The header shows that ratio live, because if it ever stops being
// large this screen is not worth anyone's evening.
const qs = new URLSearchParams(location.search);
const KEY = qs.get('key') || '';
let queue = [], at = 0, sel = 0, done = 0, fixed = 0;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function flash(msg, bad) {
  const f = $('flash');
  f.textContent = msg;
  f.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { f.className = bad ? 'bad' : ''; }, 1600);
}

async function load() {
  const r = await fetch('/api/review/sets?key=' + encodeURIComponent(KEY) + '&days=90');
  const d = await r.json();
  if (!d.available) {
    $('main').innerHTML = '<p class="stat">' + esc(d.error || d.reason || 'Unavailable — check the admin key in the URL.') + '</p>';
    return;
  }
  queue = d.queue || [];
  $('s-open').textContent = (d.openSpellings || 0).toLocaleString();
  $('s-held').textContent = (d.salesHeldUp || 0).toLocaleString();
  $('s-per').textContent = (d.salesPerDecision || 0).toLocaleString();
  $('s-alias').textContent = (d.aliasesInPlace || 0).toLocaleString();
  render();
}

function render() {
  const item = queue[at];
  if (!item) {
    $('main').innerHTML = '<div class="done"><p><b>Queue clear.</b></p>' +
      '<p class="stat">' + done + ' decided, ' + fixed.toLocaleString() +
      ' sales resolved this session.</p></div>';
    return;
  }
  sel = Math.min(sel, Math.max(0, (item.suggestions || []).length - 1));
  const rows = (item.suggestions || []).map((p, i) =>
    '<li class="' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' +
      '<kbd>' + (i + 1) + '</kbd>' +
      '<span class="pname">' + esc(p.name) + '</span>' +
      '<span class="pid">' + esc(p.id) + '</span>' +
    '</li>').join('');

  $('main').innerHTML =
    '<div class="card">' +
      '<div class="spelling">' + esc(item.year || '?') + ' &middot; ' + esc(item.setName || '(blank)') + '</div>' +
      '<div class="meta"><b>' + item.sales.toLocaleString() + '</b> sales' +
        (item.value ? ' &middot; $' + item.value.toLocaleString() + ' traded' : '') +
        ' &middot; ' + (queue.length - at) + ' left in view</div>' +
      '<div class="sample">' + esc(item.sample) + '</div>' +
      (rows ? '<ol id="opts">' + rows + '</ol>'
            : '<p class="hint">No near matches. Type a product id, or press S to skip.</p>') +
      '<input type="text" id="manual" placeholder="…or type a product id and press Enter" autocomplete="off" />' +
      '<div class="keys">' +
        '<span><kbd>1</kbd>–<kbd>5</kbd> pick</span>' +
        '<span><kbd>↑</kbd><kbd>↓</kbd> move</span>' +
        '<span><kbd>Enter</kbd> confirm</span>' +
        '<span><kbd>S</kbd> skip</span>' +
        '<span><kbd>X</kbd> not a product we carry</span>' +
      '</div>' +
    '</div>';

  document.querySelectorAll('#opts li').forEach(el => {
    el.onclick = () => { sel = Number(el.dataset.i); decide(); };
  });
}

async function decide(productIdOverride) {
  const item = queue[at];
  if (!item) return;
  const pick = productIdOverride
    || ((item.suggestions || [])[sel] && item.suggestions[sel].id);
  if (!pick) { flash('Nothing selected', true); return; }

  const r = await fetch('/api/review/sets?key=' + encodeURIComponent(KEY), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key: item.key, productId: pick }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { flash(d.error || 'Failed', true); return; }

  done++; fixed += item.sales;
  $('s-alias').textContent = (d.total || 0).toLocaleString();
  flash('+' + item.sales.toLocaleString() + ' sales → ' + pick);
  at++; sel = 0; render();
}

document.addEventListener('keydown', (e) => {
  const box = document.getElementById('manual');
  if (document.activeElement === box) {
    if (e.key === 'Enter' && box.value.trim()) { decide(box.value.trim()); }
    if (e.key !== 'Escape') return;
    box.blur(); return;
  }
  const item = queue[at];
  if (!item) return;
  const n = (item.suggestions || []).length;
  if (e.key >= '1' && e.key <= '9') {
    const i = Number(e.key) - 1;
    if (i < n) { sel = i; decide(); }
  } else if (e.key === 'ArrowDown') { sel = Math.min(n - 1, sel + 1); render(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
  else if (e.key === 'Enter') { decide(); }
  else if (e.key.toLowerCase() === 's') { at++; sel = 0; render(); }
  // Not a product we carry — a soccer card, a custom, a multi-card lot. Skipped
  // rather than stored, because there is no product to point it at and an alias
  // to nothing would be a decision that resolves nothing.
  else if (e.key.toLowerCase() === 'x') { at++; sel = 0; flash('Marked as not ours — skipped'); render(); }
});

load();
</script>
</body>
</html>
